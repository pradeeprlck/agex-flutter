name: agex_flutter
description: A new Flutter project for Agex Mobile rewrite.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  flutter_riverpod: ^3.1.0
  riverpod_annotation: ^4.0.0
  
  # Navigation
  go_router: ^17.1.0
  
  # Networking
  dio: ^5.4.0
  
  # Storage
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^10.0.0
  
  # UI & Assets
  google_fonts: ^8.0.2
  cached_network_image: ^3.3.1
  lucide_icons: ^0.257.0
  intl: ^0.20.2
  
  # Utilities
  json_annotation: ^4.8.1
  url_launcher: ^6.2.4
  
  # Voice Assistant
  speech_to_text: ^7.3.0
  flutter_tts: ^4.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.8
  json_serializable: ^6.7.1
  riverpod_generator: ^4.0.0+1

flutter:
  uses-material-design: true
